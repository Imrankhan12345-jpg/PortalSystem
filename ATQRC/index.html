<!DOCTYPE html>
<html>
<head>
    <title>Degree College Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <!-- html5-qrcode library ka CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <!-- College Header & Logo Placeholder -->
    <div class="college-header">
        <!-- Yahan aap apna logo image laga sakte hain (src mein image ka naam dein) -->
        <img src="./logo.png" alt="College Logo" class="college-logo" onerror="this.style.display='none'">
        <div>
            <h1>Government Degree College</h1>
            <p>Official Attendance Management Portal</p>
        </div>
    </div>

    <div class="main-container">
        <!-- Student Attendance Form Card -->
        <div class="card">
            <h2>Student Attendance Form</h2>
            
            <div class="form-group">
                <label>Roll Number:</label>
                <input type="text" id="rollNo" placeholder="Enter Roll Number">
            </div>

            <div class="form-group">
                <label>Select Group:</label>
                <select id="groupSelect">
                    <option value="" disabled selected>Select Group</option>
                    <option value="CS">Computer Science</option>
                    <option value="Bio">Biology Science</option>
                    <option value="Eng">Pre-Engineering</option>
                    <option value="Arts">Arts</option>
                    <option value="Gen">General</option>
                </select>
            </div>

            <button class="btn-primary" onclick="saveAttendance()">Mark Attendance Manually</button>

            <div class="divider">OR</div>

            <!-- QR Code Scan Button -->
            <button class="btn-secondary" onclick="startQRScanner()">Scan QR Code</button>

            <!-- Scanner Viewport -->
            <div id="reader" style="width: 100%; max-width: 300px; display: none; margin: 15px auto;"></div>
        </div>

        <!-- Attendance Records Section -->
        <div class="card">
            <h3>Attendance Records by Group (Today)</h3>
            
            <div class="group-box" id="csBox">
                <h4>Computer Science</h4>
                <div id="csList"></div>
            </div>

            <div class="group-box" id="bioBox">
                <h4>Biology Science</h4>
                <div id="bioList"></div>
            </div>

            <div class="group-box" id="engBox">
                <h4>Pre-Engineering</h4>
                <div id="engList"></div>
            </div>

            <div class="group-box" id="artsBox">
                <h4>Arts</h4>
                <div id="artsList"></div>
            </div>

            <div class="group-box" id="genBox">
                <h4>General</h4>
                <div id="genList"></div>
            </div>
        </div>
    </div>
    
   <script src="data.js"></script>
   <script src="app.js"></script>

</body>
</html>
