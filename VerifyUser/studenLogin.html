<!DOCTYPE html>
<html>
<head>
    <title>Student Login - Government Degree College</title>
    <link rel="stylesheet" href="./loginPortal.css">
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

    <div class="portal-container">
        <div class="portal-card">
            <img src="../ATQRC/logo.png" alt="College Logo" class="portal-logo" onerror="this.style.display='none'">
            <h2 class="portal-title">Student Login</h2>
            <p class="portal-subtitle">Apna Roll Number, Group aur Password enter karein.</p>
            
            <div class="form-group-custom">
                <label>Roll Number:</label>
                <input type="number" id="loginRollNo" placeholder="Enter Your Roll Number">
            </div>

            <div class="form-group-custom">
                <label>Select Group:</label>
                <select id="loginGroup">
                    <option value="" disabled selected>Select Your Group</option>
                    <option value="CS">Computer Science</option>
                    <option value="Bio">Biology Science</option>
                    <option value="Eng">Pre-Engineering</option>
                    <option value="Arts">Arts</option>
                    <option value="Gen">General</option>
                </select>
            </div>

            <div class="form-group-custom">
                <label>Password:</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter Password">
                    <button type="button" class="eye-btn" id="toggleStudentPass" onclick="togglePassword('loginPassword', 'toggleStudentPass')">👁️</button>
                </div>
            </div>

            <button class="btn-portal-primary" id="studentLoginBtn" onclick="studentLogin()">Login</button>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-portal-primary" style="background: #475569; font-size: 13px; padding: 8px;" onclick="window.location.href='qrcodeLogin.html'">Login AS (Vigilance)</button>
                <button class="btn-portal-primary" style="background: #0f766e; font-size: 13px; padding: 8px;" onclick="window.location.href='adminLogin.html'">Admin Login</button>
            </div>

            <div class="portal-links">
                <span>Have you no account?</span>
                <a href="studentSignUp.html">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZLCOdefBONjySJ5OAetvxoz94zZ1KBvk",
            authDomain: "studenportaldata.firebaseapp.com",
            projectId: "studenportaldata",
            storageBucket: "studenportaldata.firebasestorage.app",
            messagingSenderId: "1034159221838",
            appId: "1:1034159221838:web:a0d472290ad2982588a71f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.firebaseDB = { db, ref, set, get };
    </script>

    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../ATQRC/data.js"></script>
    <script>
        function showToast(message, isError = false) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "right",
                style: { background: isError ? "#dc2626" : "#16a34a" }
            }).showToast();
        }

        function togglePassword(fieldId, btnId) {
            const passwordField = document.getElementById(fieldId);
            const eyeBtn = document.getElementById(btnId);
            if (passwordField.type === "password") {
                passwordField.type = "text";
                eyeBtn.textContent = "👁️‍🗨️";
            } else {
                passwordField.type = "password";
                eyeBtn.textContent = "👁️";
            }
        }

        async function studentLogin() {
            var rollNoInput = Number(document.getElementById("loginRollNo").value.trim());
            var groupInput = document.getElementById("loginGroup").value;
            var passInput = document.getElementById("loginPassword").value.trim();

            if (!rollNoInput || groupInput === "" || !passInput) {
                showToast("Please enter Roll Number, Group, and Password!", true);
                return;
            }

            var found = null;
            for (var i = 0; i < registeredStudents.length; i++) {
                if (registeredStudents[i].rollNo === rollNoInput && registeredStudents[i].group === groupInput) {
                    found = registeredStudents[i];
                    break;
                }
            }

            if (!found) {
                showToast("Error: Invalid Roll Number or Group!", true);
                return;
            }

            if (window.firebaseDB) {
                const { db, ref, get, set } = window.firebaseDB;
                const studentRef = ref(db, `studentCredentials/${groupInput}_${rollNoInput}`);
                
                try {
                    const snapshot = await get(studentRef);
                    if (!snapshot.exists()) {
                        showToast("Account not found! Please Sign Up first.", true);
                        setTimeout(function() {
                            window.location.href = "studentSignUp.html";
                        }, 1500);
                        return;
                    }

                    const data = snapshot.val();
                    if (data.password !== passInput) {
                        showToast("Please enter valid password!", true);
                        return;
                    }

                    const activeRef = ref(db, `activeLogins/${groupInput}_${rollNoInput}`);
                    await set(activeRef, {
                        rollNo: rollNoInput,
                        name: found.name,
                        group: groupInput,
                        loginTime: new Date().toLocaleTimeString()
                    });

                } catch (error) {
                    console.error("Firebase error:", error);
                    showToast("Firebase error occurred!", true);
                    return;
                }
            }

            localStorage.setItem("loggedInStudent", JSON.stringify(found));
            showToast("Login Successful!");
            
            setTimeout(function() {
                window.location.href = "../ComplaintPortal/studentPortal.html";
            }, 1000);
        }
    </script>
</body>
</html>
