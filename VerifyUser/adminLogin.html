<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Government Degree College</title>
    <link rel="stylesheet" href="./loginPortal.css">
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>

    <!-- MAIN LOGIN CARD -->
    <div id="loginCardContainer" class="portal-container" style="display: none;">
        <div class="portal-card">
            <img src="../ATQRC/logo.png" alt="College Logo" class="portal-logo" onerror="this.style.display='none'">
            <h2 class="portal-title">Admin Panel Login</h2>
            <p id="stepSubtitle" class="portal-subtitle">Step 1: Enter Admin Email & Password</p>
            
            <!-- STEP 1: Email & Password -->
            <div id="stepOneContainer">
                <div class="form-group-custom">
                    <label>Admin Email:</label>
                    <input type="email" id="adminEmail" placeholder="Enter Admin Email">
                </div>

                <div class="form-group-custom">
                    <label>Password:</label>
                    <div class="password-wrapper">
                        <input type="password" id="adminPassword" placeholder="Enter Password">
                        <button type="button" class="eye-btn" id="toggleAdminPass" onclick="togglePassword('adminPassword', 'toggleAdminPass')">👁️</button>
                    </div>
                </div>

                <button class="btn-portal-primary" id="adminNextBtn" onclick="verifyStepOne()">Next</button>
            </div>

            <!-- STEP 2: Security Questions (Initially Hidden) -->
            <div id="stepTwoContainer" style="display: none;">
                <div class="form-group-custom">
                    <label>Apka Favourite Color kiya hai?</label>
                    <input type="text" id="favColor" placeholder="Enter favourite color">
                </div>

                <div class="form-group-custom">
                    <label>Apko Car kaunsi pasand hai?</label>
                    <input type="text" id="favCar" placeholder="Enter car name">
                </div>

                <div class="form-group-custom">
                    <label>Apki kiya khawahish hai ghar banane ki?</label>
                    <input type="text" id="dreamHouse" placeholder="Enter country name">
                </div>

                <div class="form-group-custom">
                    <label>Apka Rank kiya hai?</label>
                    <input type="text" id="adminRank" placeholder="Enter your rank">
                </div>

                <button class="btn-portal-primary" id="stepTwoBtn" onclick="verifyStepTwo()">Verify Security Answers</button>
            </div>

            <div class="portal-links" style="justify-content: center;">
                <a href="studenLogin.html">← Back to Student Login</a>
            </div>
        </div>
    </div>

    <!-- 404 BLOCKED SCREEN -->
    <div id="block404Screen" class="screen-404" style="display: none;">
        <h1>404</h1>
        <h2>Page Not Found - System Blocked</h2>
        <p>Admin has locked this portal due to an unauthorized login attempt.</p>
        <button class="btn-portal-primary" style="width: auto; padding: 10px 20px;" onclick="requestAdminApproval()">Admin Verification Login</button>
        <p id="pendingMsg" style="color: #16a34a; font-weight: bold; margin-top: 15px; font-size: 14px; display: none;">Verification email sent to Admin Gmail. Waiting for approval...</p>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZLCOdefBONjySJ5OAetvxoz94zZ1KBvk",
            authDomain: "studenportaldata.firebaseapp.com",
            projectId: "studenportaldata",
            storageBucket: "studenportaldata.firebasestorage.app",
            messagingSenderId: "1034159221838",
            appId: "1:1034159221838:web:a0d472290ad2982588a71f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.adminSecurityDB = { db, ref, set, get, onValue };

        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get("action");

        if (action === "allow") {
            set(ref(db, "adminSecurity/isBlocked"), false).then(() => {
                alert("System Successfully Unblocked/Allowed!");
                window.location.href = window.location.pathname;
            });
        } else if (action === "deny") {
            set(ref(db, "adminSecurity/isBlocked"), true).then(() => {
                alert("Login Request Denied. System remains blocked.");
                window.location.href = window.location.pathname;
            });
        }

        onValue(ref(db, "adminSecurity/isBlocked"), (snapshot) => {
            const blocked = snapshot.val() === true;
            if (blocked) {
                document.getElementById("loginCardContainer").style.display = "none";
                document.getElementById("block404Screen").style.display = "block";
            } else {
                document.getElementById("block404Screen").style.display = "none";
                document.getElementById("loginCardContainer").style.display = "block";
            }
        });
    </script>

    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        const WEB3FORMS_KEY = "726db66d-cf34-4f6a-8381-fb94d610accd";

        function showToast(message, isError = false) {
            Toastify({
                text: message,
                duration: 4000,
                gravity: "top",
                position: "right",
                style: { background: isError ? "#dc2626" : "#16a34a" }
            }).showToast();
        }

        // Password Show/Hide Toggle Function
        function togglePassword(fieldId, btnId) {
            const passwordField = document.getElementById(fieldId);
            const eyeBtn = document.getElementById(btnId);
            if (passwordField.type === "password") {
                passwordField.type = "text";
                eyeBtn.textContent = "👁️‍🗨️";
            } else {
                passwordField.type = "password";
                eyeBtn.textContent = "👁️";
            }
        }

        async function sendWeb3Alert(subjectText, messageText) {
            var formData = new FormData();
            formData.append("access_key", WEB3FORMS_KEY);
            formData.append("name", "GDC Admin Security");
            formData.append("email", "Imranaijazkhan28@gmail.com");
            formData.append("subject", subjectText);
            formData.append("message", messageText);

            try {
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();
                return result.success;
            } catch (error) {
                console.error("Network Error:", error);
                return false;
            }
        }

        async function requestAdminApproval() {
            document.getElementById("pendingMsg").style.display = "block";
            var currentTime = new Date().toLocaleString();
            var baseUrl = window.location.origin + window.location.pathname;

            var allowLink = baseUrl + "?action=allow";
            var denyLink = baseUrl + "?action=deny";

            await sendWeb3Alert(
                "ADMIN LOGIN APPROVAL REQUIRED",
                "Alert: Kisi ne Admin Panel mein login karne ki koshish ki hai (" + currentTime + ").\n\nKya aap is login ko allow karna chahte hain?\n\n👉 ALLOW KARNE KE LIYE IS LINK PAR CLICK KAREIN:\n" + allowLink + "\n\n❌ BLOCK RAKHNE KE LIYE IS LINK PAR CLICK KAREIN:\n" + denyLink
            );

            showToast("Approval request sent to Admin Gmail!");
        }

        function verifyStepOne() {
            var email = document.getElementById("adminEmail").value.trim();
            var password = document.getElementById("adminPassword").value.trim();

            if (!email || !password) {
                showToast("Please enter Email and Password!", true);
                return;
            }

            if (email.toLowerCase() === "imrankhan104@gmail.com" && password === "GDC@IK104") {
                showToast("Step 1 Verified! Please answer security questions.");
                document.getElementById("stepOneContainer").style.display = "none";
                document.getElementById("stepTwoContainer").style.display = "block";
                document.getElementById("stepSubtitle").innerText = "Step 2: Security Verification";
            } else {
                showToast("Invalid Admin Email or Password!", true);
            }
        }

        async function verifyStepTwo() {
            var color = document.getElementById("favColor").value.trim().toLowerCase();
            var car = document.getElementById("favCar").value.trim().toLowerCase();
            var house = document.getElementById("dreamHouse").value.trim().toLowerCase();
            var rank = document.getElementById("adminRank").value.trim().toLowerCase();

            if (!color || !car || !house || !rank) {
                showToast("Please answer all security questions!", true);
                return;
            }

            var currentTime = new Date().toLocaleString();

            if (color === "purple" && car === "lamborghani aventor" && house === "australia" && rank === "chaprasi") {
                await sendWeb3Alert(
                    "Admin Panel Successful Login Alert",
                    "Alert: Admin panel successfully login ho gaya hai is time (" + currentTime + ")."
                );

                showToast("Login Successful! Redirecting to Dashboard...");
                localStorage.setItem("adminLoggedIn", "true");

                setTimeout(function() {
                    window.location.href = "../admin/mainDashboard.html";
                }, 1000);

            } else {
                if (window.adminSecurityDB) {
                    const { db, ref, set } = window.adminSecurityDB;
                    await set(ref(db, "adminSecurity/isBlocked"), true);
                }

                var allowLink = window.location.origin + window.location.pathname + "?action=allow";
                var denyLink = window.location.origin + window.location.pathname + "?action=deny";

                await sendWeb3Alert(
                    "SECURITY WARNING: Unauthorized Login & System Blocked!",
                    "Warning: Ghalat security answers diye gaye hain (" + currentTime + "). System block kar diya gaya hai.\n\nAgar aap allow karna chahte hain: " + allowLink + "\n\nAgar deny karna chahte hain: " + denyLink
                );

                showToast("Access Denied! System Blocked.", true);
            }
        }
    </script>
</body>
</html>
