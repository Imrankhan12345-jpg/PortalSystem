<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Government Degree College</title>
    <link rel="stylesheet" href="./studentPortal.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body onload="checkLoginAndLoad()">

    <div class="college-header">
        <img src="../ATQRC/logo.png" alt="College Logo" class="college-logo" onerror="this.style.display='none'">
        <div>
            <h1>Government Degree College</h1>
            <p>Student Attendance Report &amp; Complaint Portal</p>
        </div>
    </div>

    <div class="main-container">
        <div id="dashboardSection">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2 id="studentWelcomeName" style="margin-bottom: 5px;">Welcome, Student</h2>
                        <p id="studentInfoText" style="color: #64748b; margin: 0; font-size: 14px;">Roll No: -- | Group: --</p>
                    </div>
                    <button class="btn-logout" onclick="handleStudentLogout()">Logout</button>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

                <div class="stats-box" style="display: flex; gap: 15px;">
                    <div class="stat-item" style="flex: 1;">
                        <span class="stat-number" id="totalPresentCount">0</span>
                        <span class="stat-label">Total Days Present</span>
                    </div>
                    <div class="stat-item" style="flex: 1; border-left-color: #2563eb;">
                        <span class="stat-number" id="attendanceAccuracy" style="color: #2563eb;">0%</span>
                        <span class="stat-label">Attendance Accuracy</span>
                    </div>
                </div>

                <h3 style="margin-top: 20px;">Your Attendance History</h3>
                <div id="attendanceHistoryList" class="history-list"></div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h3>Submit Attendance Complaint / Issue</h3>
                <div class="form-group">
                    <label>Your Email Address:</label>
                    <input type="email" id="complaintEmail" placeholder="student@example.com">
                </div>
                <div class="form-group">
                    <label>Complaint Title (Mukhtasir unwan):</label>
                    <input type="text" id="complaintTitle" placeholder="e.g., Present on Monday but marked Absent">
                </div>
                <div class="form-group">
                    <label>Complaint Details / Message:</label>
                    <textarea id="complaintText" rows="4" placeholder="Apni complaint tafseel se yahan likhein..."></textarea>
                </div>
                <button class="btn-secondary" onclick="submitNewComplaint()">Submit Complaint</button>
                <h4 style="margin-top: 25px; color: #0b2545;">Your Submitted Complaints</h4>
                <div id="myComplaintsList"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZLCOdefBONjySJ5OAetvxoz94zZ1KBvk",
            authDomain: "studenportaldata.firebaseapp.com",
            databaseURL: "https://studenportaldata-default-rtdb.firebaseio.com",
            projectId: "studenportaldata",
            storageBucket: "studenportaldata.firebasestorage.app",
            messagingSenderId: "1034159221838",
            appId: "1:1034159221838:web:a0d472290ad2982588a71f"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            window.firebaseDB = { db, ref, set, get };
        } catch (error) {
            console.error("Firebase initialization error:", error);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../ATQRC/data.js"></script>
    <script src="studentPortal.js"></script>
    <script>
        async function checkLoginAndLoad() {
            let studentData;
            try {
                studentData = JSON.parse(localStorage.getItem("loggedInStudent") || "null");
            } catch (error) {
                console.error("Unable to read saved student login:", error);
            }

            if (!studentData || !studentData.rollNo || !studentData.group) {
                alert("Please login first!");
                window.location.replace("../VerifyUser/studenLogin.html");
                return;
            }

            window.currentStudent = studentData;
            document.getElementById("studentWelcomeName").innerText = "Welcome, " + (studentData.name || "Student");
            document.getElementById("studentInfoText").innerText = "Roll No: " + studentData.rollNo + " | Group: " + studentData.group;

            if (typeof loadStudentAttendanceSummary === "function") {
                await loadStudentAttendanceSummary();
            }
            if (typeof loadStudentComplaints === "function") {
                loadStudentComplaints();
            }
        }

        async function handleStudentLogout() {
            let studentData = window.currentStudent;
            if (!studentData) {
                try {
                    studentData = JSON.parse(localStorage.getItem("loggedInStudent") || "null");
                } catch (error) {
                    console.error("Unable to read student session during logout:", error);
                }
            }

            // Best-effort cleanup: logging out must still work if Firebase is unavailable.
            if (studentData && window.firebaseDB) {
                try {
                    const { db, ref, set } = window.firebaseDB;
                    await set(ref(db, `activeLogins/${studentData.group}_${studentData.rollNo}`), null);
                } catch (error) {
                    console.error("Could not clear Firebase active login:", error);
                }
            }

            // Remove only the login session; preserve attendance and complaint records.
            localStorage.removeItem("loggedInStudent");
            window.currentStudent = null;
            window.location.replace("../VerifyUser/studenLogin.html");
        }
    </script>
</body>
</html>
